services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: GestionCitasdb
      POSTGRES_USER: cmas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: ./backend }
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: GestionCitasdb
      DB_USERNAME: cmas
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_APP_ID: ${REVERB_APP_ID:-local-app}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-secret}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  queue:
    build: { context: ./backend }
    command: php artisan queue:work redis --sleep=1 --tries=3
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_HOST: postgres
      DB_DATABASE: GestionCitasdb
      DB_USERNAME: cmas
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  horizon:
    build: { context: ./backend }
    command: php artisan horizon
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_HOST: postgres
      DB_DATABASE: GestionCitasdb
      DB_USERNAME: cmas
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    build: { context: ./backend }
    command: php artisan schedule:work
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_HOST: postgres
      DB_DATABASE: GestionCitasdb
      DB_USERNAME: cmas
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  reverb:
    build: { context: ./backend }
    command: php artisan reverb:start
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_HOST: postgres
      DB_DATABASE: GestionCitasdb
      DB_USERNAME: cmas
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_APP_ID: ${REVERB_APP_ID:-local-app}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-secret}
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pgdata: {}